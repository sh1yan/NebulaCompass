<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星云罗盘 - 任务管理</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-layout">
        <nav class="sidebar">
            <div class="sidebar-header">
                <h2>星云罗盘 - 资产测绘平台</h2>
            </div>
            <ul class="sidebar-nav">
                <li><a href="/tasks" class="active">扫描任务</a></li>
                <li><a href="/docs">文档说明</a></li>
                <li><a href="/dns">DNS查询</a></li>
                <li><a href="/settings">系统设置</a></li>
            </ul>
            <div class="sidebar-footer">
                <button id="changePwdBtn" class="btn btn-sm" onclick="showChangePwd()">修改密码</button>
                <button class="btn btn-sm btn-danger" onclick="handleLogout()">退出登录</button>
            </div>
        </nav>
        <main class="main-content">
            <header class="page-header">
                <h1>扫描任务</h1>
                <div class="page-header-actions">
                    <button class="btn btn-soft btn-soft-neutral" onclick="refreshTasks()">&#x21bb; 刷新</button>
                    <button class="btn btn-solid btn-solid-primary" onclick="showCreateTask()">+ 新建任务</button>
                </div>
            </header>

            <div class="task-toolbar">
                <div class="search-field" id="taskSearchField">
                    <svg class="search-icon" viewBox="0 0 24 24" width="15" height="15" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"></circle>
                        <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
                    </svg>
                    <input type="text" id="taskSearchInput" autocomplete="off" spellcheck="false"
                           placeholder="搜索任务名称 / 扫描目标 / 状态"
                           oninput="taskSearchChanged()" onkeydown="handleTaskSearchKey(event)">
                    <button type="button" class="search-clear" id="taskSearchClear" title="清空搜索" onclick="clearTaskSearch()">
                        <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor"
                             stroke-width="2.6" stroke-linecap="round" aria-hidden="true">
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <span class="search-count" id="taskSearchCount"></span>
            </div>

            <div id="taskList" class="task-list">
                <div class="loading">加载中...</div>
            </div>

            <div id="taskPager" class="task-pager" style="display:none">
                <span id="taskPagerInfo" class="task-pager-info"></span>
                <span style="display:flex;align-items:center;gap:8px">
                    <button id="taskPrevBtn" class="btn btn-sm pagination-btn" onclick="taskPrevPage()" disabled>上一页</button>
                    <span id="taskPageIndicator" class="pagination-indicator">第 1/1 页</span>
                    <button id="taskNextBtn" class="btn btn-sm pagination-btn" onclick="taskNextPage()" disabled>下一页</button>
                </span>
            </div>
        </main>
    </div>

    <!-- 新建任务弹窗 -->
    <div id="createTaskModal" class="modal" style="display:none">
        <div class="modal-content" style="max-width:600px">
            <span class="modal-close" onclick="closeModal('createTaskModal')">&times;</span>
            <h2>新建扫描任务</h2>
            <form id="createTaskForm" onsubmit="return handleCreateTask(event)">
                <div class="scan-mode-group">
                    <label>扫描模式</label>
                    <div class="scan-mode-options" id="scanModeOptions">
                        <label class="scan-mode-option selected" data-mode="full" onclick="selectScanMode(this)">
                            <input type="radio" name="scan_mode" value="full" checked> 全套扫描
                        </label>
                        <label class="scan-mode-option" data-mode="alive_only" onclick="selectScanMode(this)">
                            <input type="radio" name="scan_mode" value="alive_only"> 存活探测
                        </label>
                        <label class="scan-mode-option" data-mode="port_only" onclick="selectScanMode(this)">
                            <input type="radio" name="scan_mode" value="port_only"> 端口扫描
                        </label>
                        <label class="scan-mode-option" data-mode="service_only" onclick="selectScanMode(this)">
                            <input type="radio" name="scan_mode" value="service_only"> 服务识别
                        </label>
                        <label class="scan-mode-option" data-mode="nmap_port_scan" onclick="selectScanMode(this)">
                            <input type="radio" name="scan_mode" value="nmap_port_scan"> Nmap 端口扫描
                        </label>
                    </div>
                </div>
                <div id="scanModeHint" class="scan-mode-hint" style="display:block">
                    默认扫描流程：存活探测 &rarr; Masscan端口扫描 &rarr; 服务版本识别
                </div>
                <div class="form-group">
                    <label for="taskName">任务名称</label>
                    <input type="text" id="taskName" placeholder="例如: 内网A段扫描" required>
                </div>
                <div class="form-group">
                    <label for="taskTarget">扫描目标</label>
                    <textarea id="taskTarget" rows="3" placeholder="每行一个：&#10;192.168.1.0/24&#10;10.0.0.1&#10;172.16.0.0/16" required oninput="onTaskTargetInput()"></textarea>
                    <small class="form-hint" id="targetHint">支持多个目标，每行一个。支持 CIDR、IP 范围、单个 IP</small>
                    <div id="serviceTargetWarn" class="target-warn" style="display:none"></div>
                </div>
                <div class="csv-upload-area">
                    <label class="csv-upload-btn" onclick="document.getElementById('csvFileInput').click()">
                        &#128194; 导入 CSV/IP 列表
                    </label>
                    <input type="file" id="csvFileInput" accept=".csv,.txt" onchange="handleCSVImport(event)">
                    <span id="csvFileInfo" class="csv-file-info"></span>
                </div>

                <div class="form-group" id="portPresetGroup">
                    <div class="port-preset-head">
                        <label class="port-preset-title">预置端口列表<span class="port-preset-sub">可多选</span></label>
                        <div class="port-preset-tools">
                            <span class="port-preset-selected" id="portPresetSelectedInfo">已选 0 项</span>
                            <button type="button" class="btn-mini" onclick="selectAllPortPresets(true)">全选</button>
                            <button type="button" class="btn-mini" onclick="selectAllPortPresets(false)">清空</button>
                        </div>
                    </div>
                    <div id="portPresetList" class="port-preset-list">
                        <span class="form-hint">加载中...</span>
                    </div>
                    <small class="form-hint">勾选后自动与下方自定义端口合并去重</small>
                </div>

                <div class="form-group" id="portRangeGroup">
                    <label for="taskPortRange">自定义端口范围</label>
                    <input type="text" id="taskPortRange" placeholder="例如: 1-65535 / 80,443,8000-8100 / U:53,161"
                           value="1-65535" oninput="updatePortSpecPreview()">
                    <small class="form-hint">TCP 直接写端口或区间；UDP 加 <code>U:</code> 前缀（如 <code>U:53,161</code>）</small>
                </div>

                <div class="port-spec-preview" id="portSpecPreview">最终端口规约：1-65535（约 65535 个端口）</div>

                <button type="submit" class="btn btn-primary btn-full">创建并开始扫描</button>
            </form>
        </div>
    </div>

    <!-- 修改密码弹窗 -->
    <div id="changePwdModal" class="modal" style="display:none">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal('changePwdModal')">&times;</span>
            <h2>修改密码</h2>
            <form id="changePwdForm" onsubmit="return handleChangePwd(event)">
                <div class="form-group">
                    <label for="oldPassword">当前密码</label>
                    <input type="password" id="oldPassword" required>
                </div>
                <div class="form-group">
                    <label for="newPassword">新密码</label>
                    <input type="password" id="newPassword" minlength="8" placeholder="至少 8 位" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">确认新密码</label>
                    <input type="password" id="confirmPassword" required>
                </div>
                <div id="changePwdError" class="form-error" style="display:none"></div>
                <button type="submit" class="btn btn-primary btn-full">确认修改</button>
            </form>
        </div>
    </div>

    <!-- 二次确认弹窗 -->
    <div id="confirmModal" class="modal confirm-modal" style="display:none">
        <div class="modal-content">
            <div class="confirm-icon" id="confirmIcon">&#9888;</div>
            <div class="confirm-title" id="confirmTitle">确认操作</div>
            <div class="confirm-message" id="confirmMessage">确定要执行此操作吗？</div>
            <div class="confirm-actions">
                <button class="btn" onclick="closeConfirmModal()">取消</button>
                <button class="btn btn-danger" id="confirmActionBtn" onclick="executeConfirmedAction()">确认</button>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
